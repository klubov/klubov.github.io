<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1D Prop calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <section class="section" id="app" v-cloak>
        <div class="container">
            <div class="columns is-flex-direction-row-reverse">
                <div class="column">
                    <img src="illustration.png" style="width: 100%; height: auto;">
                </div>
                <div class="column">
                    <div class="columns">
                        <div class="column is-two-fifths">
                            <div class="field">
                                <label class="label">{{ t('Step') }}</label>
                                <div class="control">
                                    <div class="select">
                                        <select v-model="form.step">
                                            <option v-for="step in steps" :value="step">{{ step }}%</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">{{ t('Offset') }} (S)</label>
                                <div class="control">
                                    <input class="input" type="text" :placeholder="t('Offset')" v-model="form.offset">
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">{{ t('Diameter') }} (D)</label>
                                <div class="control">
                                    <input class="input" type="text" :placeholder="t('Diameter')" v-model="form.diameter">
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">{{ t('Pitch') }} (P)</label>
                                <div class="control">
                                    <input class="input" type="text" :placeholder="t('Pitch')" v-model="form.pitch">
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">{{ t('PitchMethod') }}</label>
                                <div class="control">
                                    <div class="select">
                                        <select v-model="form.method">
                                            <option value="helical">{{ t('Helical') }}</option>
                                            <option value="treger">{{ t('Treger') }}</option>
                                            <option value="quadratic">{{ t('Quadratic') }}</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <template v-if="form.method !== 'helical'">
                                <label class="label">{{ t('Transition') }}</label>
                                <div class="field has-addons mb-0">
                                    <div class="control is-expanded">
                                        <input class="input" type="text" :placeholder="t('Transition')" v-model="form.transition">
                                    </div>
                                    <div class="control">
                                        <div class="select">
                                            <select v-model="form.transitionType">
                                                <option value="length">{{ t(form.unit) }} ({{ t('radius') }})</option>
                                                <option value="percent">{{ t('OfRadius') }}</option>
                                                <option value="angle">{{ t('Angle') }}, &deg;</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <p class="help mb-3">
                                    r = {{ transitionInfo.radius }} {{ t(form.unit) }},
                                    {{ transitionInfo.percent }}%,
                                    {{ transitionInfo.angle }}&deg;
                                </p>
                                <div class="field">
                                    <label class="label">{{ t('FinalPitch') }}</label>
                                    <div class="control">
                                        <input class="input" type="text" :placeholder="t('FinalPitch')" v-model="form.finalPitch">
                                    </div>
                                </div>
                            </template>
                        </div>
                        <div class="column"></div>
                        <div class="column is-two-fifths">
                            <div class="field">
                                <label class="label">{{ t('Language') }}</label>
                                <div class="control">
                                    <div class="select">
                                        <select v-model="form.language">
                                            <option v-for="item in languages" :value="item.code">{{ item.name }}</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">{{ t('Units') }}</label>
                                <div class="control">
                                    <label class="radio">
                                        <input type="radio" name="unit" value="mm" v-model="form.unit">
                                        {{ t('mm')}}
                                    </label>
                                    <label class="radio">
                                        <input type="radio" name="unit" value="inch" v-model="form.unit">
                                        {{ t('inch')}}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="columns">
                <div class="column is-half">
                    <table class="table is-fullwidth">
                        <thead>
                        <tr>
                            <th>L, %</th>
                            <th class="has-text-centered">L, {{ t(form.unit) }}</th>
                            <th v-if="form.method !== 'helical'" class="has-text-centered">{{ t('Pitch') }}, {{ t(form.unit) }}</th>
                            <th class="has-text-right">{{ t('Angle') }}, &deg;</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="row in getData">
                            <td>{{ row.step }}</td>
                            <td class="has-text-centered">{{ row.x }}</td>
                            <td v-if="form.method !== 'helical'" class="has-text-centered">{{ row.pitch }}</td>
                            <td class="has-text-right">{{ row.angle }}</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16"></script>
    <script>
      const localization = {
        data: {
          languages: [
            {code: 'en', name: 'English'},
            {code: 'es', name: 'Español'},
            {code: 'ru', name: 'Русский'},
            {code: 'uk', name: 'Українська'}
          ],
          translations: {
            en: {
              Language: 'Language',
              Units: 'Units',
              mm: 'mm',
              inch: 'inch',
              Step: 'Step',
              Offset: 'Offset',
              Diameter: 'Diameter',
              Pitch: 'Pitch',
              Angle: 'Angle',
              PitchMethod: 'Pitch method',
              Helical: 'Helical',
              Treger: 'Ivan Treger method',
              Quadratic: 'Delayed quadratic',
              Transition: 'Transition point',
              OfRadius: '% of radius',
              radius: 'radius',
              FinalPitch: 'Final pitch'
            },
            es: {
              Language: 'Idioma',
              Units: 'Unidades',
              mm: 'mm',
              inch: 'pulgada',
              Step: 'Paso',
              Offset: 'Desplazamiento',
              Diameter: 'Diámetro',
              Pitch: 'Paso',
              Angle: 'Ángulo',
              PitchMethod: 'Método de paso',
              Helical: 'Helicoidal',
              Treger: 'Método de Ivan Treger',
              Quadratic: 'Cuadrática diferida',
              Transition: 'Punto de transición',
              OfRadius: '% del radio',
              radius: 'radio',
              FinalPitch: 'Paso final'
            },
            ru: {
              Language: 'Язык',
              Units: 'Единицы',
              mm: 'мм',
              inch: 'дюйм',
              Step: 'Шаг',
              Offset: 'Смещение',
              Diameter: 'Диаметр',
              Pitch: 'Шаг',
              Angle: 'Угол',
              PitchMethod: 'Способ построения шага',
              Helical: 'Геликоидная',
              Treger: 'Метод Ивана Трегера',
              Quadratic: 'Квадратичная с отступом',
              Transition: 'Отступ',
              OfRadius: '% от радиуса',
              radius: 'радиус',
              FinalPitch: 'Конечное значение шага'
            },
            uk: {
              Language: 'Мова',
              Units: 'Одиниці',
              mm: 'мм',
              inch: 'дюйм',
              Step: 'Крок',
              Offset: 'Зміщення',
              Diameter: 'Діаметр',
              Pitch: 'Крок',
              Angle: 'Кут',
              PitchMethod: 'Спосіб побудови кроку',
              Helical: 'Гелікоїдна',
              Treger: 'Метод Івана Трегера',
              Quadratic: 'Квадратична з відступом',
              Transition: 'Відступ',
              OfRadius: '% від радіуса',
              radius: 'радіус',
              FinalPitch: 'Кінцеве значення кроку'
            }
          }
        }
      }
      new Vue({
        el: '#app',
        mixins: [localization],
        data: {
          steps: [1, 2, 5, 10, 12.5, 20, 25],
          form: {
            language: 'en',
            unit: 'mm',
            step: 10,
            offset: 0,
            diameter: 350,
            pitch: 500,
            method: 'helical',
            transition: 70,
            transitionType: 'percent',
            finalPitch: 400
          }
        },
        created: function() {
          const language = window.localStorage.getItem('language')
          this.form.language = null === language ? 'en' : language
          const unit = window.localStorage.getItem('unit')
          this.form.unit = null === unit ? 'mm' : unit
          const step = window.localStorage.getItem('step')
          this.form.step = null === step ? 10 : step
          const offset = window.localStorage.getItem('offset')
          this.form.offset = null === offset ? 0 : offset
          const diameter = window.localStorage.getItem('diameter')
          this.form.diameter = null === diameter ? 350 : diameter
          const pitch = window.localStorage.getItem('pitch')
          this.form.pitch = null === pitch ? 500 : pitch
          const method = window.localStorage.getItem('method')
          this.form.method = null === method ? 'helical' : method
          const transition = window.localStorage.getItem('transition')
          this.form.transition = null === transition ? 70 : transition
          const transitionType = window.localStorage.getItem('transitionType')
          this.form.transitionType = null === transitionType ? 'percent' : transitionType
          const finalPitch = window.localStorage.getItem('finalPitch')
          this.form.finalPitch = null === finalPitch ? 400 : finalPitch
        },
        methods: {
          t: function(text) {
            return this.translations[this.form.language][text] || text
          },
          // Helical pitch up to the transition radius, then the pitch changes from P
          // to the final pitch at the tip: linearly (Treger method) or quadratically,
          // starting tangent to the constant pitch
          getPitch: function(r) {
            const pitch = Number(this.form.pitch)
            const radius = this.form.diameter / 2
            const transition = this.transitionRadius
            if ('helical' === this.form.method || r <= transition || transition >= radius) {
              return pitch
            }
            const k = (r - transition) / (radius - transition)
            return pitch + (this.form.finalPitch - pitch) * ('quadratic' === this.form.method ? k * k : k)
          }
        },
        computed: {
          // Radius (from the axis) where the pitch starts to change
          transitionRadius: function() {
            const value = Number(this.form.transition)
            let r = value
            if ('percent' === this.form.transitionType) {
              r = this.form.diameter / 2 * value / 100
            } else if ('angle' === this.form.transitionType) {
              r = this.form.pitch / (2 * Math.PI * Math.tan(value * Math.PI / 180))
            }
            return Math.max(0, r)
          },
          transitionInfo: function() {
            const r = this.transitionRadius
            return {
              radius: Math.round(r * 100) / 100,
              percent: Math.round(r / (this.form.diameter / 2) * 100 * 100) / 100,
              angle: Math.round(Math.atan(this.form.pitch / (2 * Math.PI * r)) * (180 / Math.PI) * 100) / 100
            }
          },
          getData: function() {
            let data = []
            const ei = 100 / this.form.step
            let step = 0
            for (let i = 0; i <= ei; i++) {
              const x = Math.round((this.form.diameter / 2 - this.form.offset) / 100 * step * 100) / 100
              const r = x + Number(this.form.offset)
              const pitch = this.getPitch(r)
              const angle = Math.round(Math.atan(pitch / (2 * Math.PI * r)) * (180 / Math.PI) * 100) / 100
              data.push({step, x, angle, pitch: Math.round(pitch * 100) / 100})
              step = Number(step) + Number(this.form.step)
            }
            return data
          }
        },
        watch: {
          'form.language': function (value) {
            window.localStorage.setItem('language', value)
          },
          'form.unit': function (value) {
            window.localStorage.setItem('unit', value)
          },
          'form.step': function (value) {
            window.localStorage.setItem('step', value)
          },
          'form.offset': function (value) {
            window.localStorage.setItem('offset', value)
          },
          'form.diameter': function (value) {
            window.localStorage.setItem('diameter', value)
          },
          'form.pitch': function (value) {
            window.localStorage.setItem('pitch', value)
          },
          'form.method': function (value) {
            window.localStorage.setItem('method', value)
          },
          'form.transition': function (value) {
            window.localStorage.setItem('transition', value)
          },
          'form.transitionType': function (value) {
            window.localStorage.setItem('transitionType', value)
          },
          'form.finalPitch': function (value) {
            window.localStorage.setItem('finalPitch', value)
          }
        }
      })
    </script>
</body>
</html>
